<!--
  panel-shell.html — reusable panel shell template
  Copy this into a new widget's index.html as a starting point.
  Replace {{WIDGET_TITLE}} and {{WIDGET_SLOT}} with actual content.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WIDGET_TITLE}} — NebulaCast HUD</title>

  <!-- Shared layer -->
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/typography.css">

  <!-- Widget-specific styles -->
  <!-- <link rel="stylesheet" href="./widget.css"> -->
</head>
<body>

  <div class="nc-panel nc-panel--clipped" role="region" aria-label="{{WIDGET_TITLE}}">

    <div class="nc-panel__header">
      <span class="nc-text--upper nc-text--accent">{{WIDGET_TITLE}}</span>
    </div>

    <div class="nc-panel__body">
      <!-- {{WIDGET_SLOT}} -->
    </div>

  </div>

  <!-- Shared scripts -->
  <script src="../../shared/js/hud-core.js"></script>
  <!-- <script src="./widget.js"></script> -->

</body>
</html>
