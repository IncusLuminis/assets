<!--
  hud-frame.html — full-screen HUD frame template
  Use for widgets that occupy the full viewport (e.g. targeting overlays).
  Replace {{WIDGET_TITLE}} and {{WIDGET_SLOT}}.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{WIDGET_TITLE}} — NebulaCast HUD</title>

  <!-- Shared layer -->
  <link rel="stylesheet" href="../../shared/css/reset.css">
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/animations.css">
  <link rel="stylesheet" href="../../shared/css/typography.css">

  <!-- Widget-specific styles -->
  <!-- <link rel="stylesheet" href="./widget.css"> -->

  <style>
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nc-hud-frame {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Corner bracket decorations */
    .nc-hud-frame__corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--hud-line);
      border-style: solid;
    }
    .nc-hud-frame__corner--tl { top: 16px; left: 16px;  border-width: 2px 0 0 2px; }
    .nc-hud-frame__corner--tr { top: 16px; right: 16px;  border-width: 2px 2px 0 0; }
    .nc-hud-frame__corner--bl { bottom: 16px; left: 16px;  border-width: 0 0 2px 2px; }
    .nc-hud-frame__corner--br { bottom: 16px; right: 16px;  border-width: 0 2px 2px 0; }
  </style>
</head>
<body>

  <div class="nc-hud-frame" role="main">
    <div class="nc-hud-frame__corner nc-hud-frame__corner--tl"></div>
    <div class="nc-hud-frame__corner nc-hud-frame__corner--tr"></div>
    <div class="nc-hud-frame__corner nc-hud-frame__corner--bl"></div>
    <div class="nc-hud-frame__corner nc-hud-frame__corner--br"></div>

    <!-- {{WIDGET_SLOT}} -->
  </div>

  <!-- Shared scripts -->
  <script src="../../shared/js/hud-core.js"></script>
  <!-- <script src="./widget.js"></script> -->

</body>
</html>
