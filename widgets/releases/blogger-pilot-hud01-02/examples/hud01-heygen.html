<!--
  NebulaCast HUD-01 Object Lock — EXAMPLE: HTML Mode, HeyGen Vertical Video
  ==========================================================================
  Ready to paste into a Blogger post (HTML mode).
  Global CSS and JS must already be in the Blogger template.

  Collapse mode : micro  (data-collapse="micro")
  Title class   : nc-ol-title-micro  (micro thumbnail context)
  Button class  : nc-ol-btn-micro

  What this example shows:
  - HTML mode: text slot shown
  - Vertical (portrait) video embed, 9:16 ratio — ideal for HeyGen AI avatar videos
  - Text below the video

  To customise:
  1. Replace HEYGEN_VIDEO_ID with your HeyGen share link or embed URL
     HeyGen embed format: https://share.heygen.com/embed/VIDEO_ID
     (Find "Embed" in your HeyGen video settings)
  2. Replace the <p> tags with your post text
-->

<div class="nc-hud-01 nc-ol-widget"
     data-mode="html"
     data-reticle="off"
     data-aladdin="off"
     data-collapse="micro">
  <!-- Outer h2: visible ONLY in micro collapsed state (above the slot).
       Hidden in expanded state via CSS. -->
  <h2 class="nc-ol-title-micro">АГЕНТ СВЯЗИ</h2>
  <div class="nc-ol-panel">

    <svg class="nc-ol-frame-svg" viewBox="0 0 1200 420" preserveAspectRatio="none" aria-hidden="true">
      <path class="nc-ol-frame-line"
        d="M22 42 L112 42 L158 8 L1160 8 L1190 38 L1190 380 L1160 410 L42 410 L12 380 L12 86 Z" />
      <path class="nc-ol-frame-line nc-ol-frame-inner"
        d="M36 62 L126 62 L170 26 L1145 26 L1174 54 L1174 366 L1145 394 L60 394 L26 364 L26 96 Z" />
      <path class="nc-ol-frame-line nc-ol-frame-photo-top"
        d="M132 58 L548 58 L586 12 L708 12" />
      <path class="nc-ol-frame-line nc-ol-frame-photo-bottom"
        d="M62 392 L500 392" />
      <rect class="nc-ol-frame-tab nc-ol-frame-tab-top" x="770" y="10" width="285" height="14" rx="3" />
      <path class="nc-ol-frame-tab" d="M0 190 L12 200 L12 250 L0 260 Z" />
      <path class="nc-ol-frame-tab" d="M1200 178 L1188 190 L1188 250 L1200 262 Z" />
      <path class="nc-ol-runner-tail"
        d="M22 42 L112 42 L158 8 L1160 8 L1190 38 L1190 380 L1160 410 L42 410 L12 380 L12 86 Z" />
      <path class="nc-ol-runner-body"
        d="M22 42 L112 42 L158 8 L1160 8 L1190 38 L1190 380 L1160 410 L42 410 L12 380 L12 86 Z" />
      <path class="nc-ol-runner-head"
        d="M22 42 L112 42 L158 8 L1160 8 L1190 38 L1190 380 L1160 410 L42 410 L12 380 L12 86 Z" />
      <path class="nc-ol-runner-spark"
        d="M22 42 L112 42 L158 8 L1160 8 L1190 38 L1190 380 L1160 410 L42 410 L12 380 L12 86 Z" />
    </svg>

    <div class="nc-ol-sweep nc-panel-sweep"></div>

    <div class="nc-ol-progress" aria-hidden="true">
      <div class="nc-ol-progress__fill"></div>
    </div>

    <div class="nc-ol-left" aria-hidden="true"></div>
    <div class="nc-ol-right" aria-hidden="true"></div>

    <!-- HTML content slot -->
    <div class="nc-hud-01-html-slot" aria-hidden="false">

      <h2 class="nc-ol-title-micro">АГЕНТ СВЯЗИ</h2>

      <!--
        Vertical video embed — 9:16 portrait format for HeyGen AI avatar videos.
        Replace HEYGEN_VIDEO_ID with your actual HeyGen embed URL.
        The nc-hud-media-vertical class enforces 9:16 aspect ratio.
      -->
      <div class="nc-hud-media nc-hud-media-vertical">
        <div class="nc-reconnect">RECONNECTING…</div>
        <iframe
          src="https://share.heygen.com/embed/HEYGEN_VIDEO_ID"
          frameborder="0"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen>
        </iframe>
      </div>

      <p>Входящее сообщение от агента связи. Шифрование: уровень «Дельта». Приоритет: высокий.</p>

      <p>Сеанс зафиксирован бортовой системой. Запись доступна в архиве сектора 3.</p>

      <a href="#" class="nc-ol-btn-micro">ДОСТУП</a>

    </div>

  </div>
</div>

<script>
(function () {
  var all    = document.querySelectorAll('.nc-hud-01:not([data-hud-init])');
  var widget = all[all.length - 1];
  if (!widget) return;
  widget.setAttribute('data-hud-init', '1');
  NcHud01.init(widget);
})();
</script>
